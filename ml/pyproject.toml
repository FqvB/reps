[project]
name = "hitreg-ml"
version = "0.1.0"
description = "Labelling, data checks and training-clip tools for the Reps swing classifier"
readme = "README.md"
authors = [
    { name = "ar4t1c", email = "emils.sangovics@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "coremltools>=9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[project.scripts]
hitreg-ml = "hitreg_ml:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
